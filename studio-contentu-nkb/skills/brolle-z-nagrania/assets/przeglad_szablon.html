<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przegląd b-rolli</title>
<style>
  :root {
    --bg: #f6f4f1; --card: #ffffff; --text: #1d1b19; --muted: #6b6560;
    --line: #e4dfd9; --accent: #3d6fb6; --accent-ink: #ffffff; --accent-soft: #dfe8f6; --chip: #ece8e3;
    --core: #2f7d32; --pad: #8a8079; --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161514; --card: #201f1d; --text: #f1eeea; --muted: #a39d96;
      --line: #34312e; --accent: #7fa7e6; --accent-ink: #111111; --accent-soft: #23314a; --chip: #2b2927;
      --core: #6cc070; --pad: #7d756d; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161514; --card: #201f1d; --text: #f1eeea; --muted: #a39d96;
    --line: #34312e; --accent: #7fa7e6; --accent-ink: #111111; --accent-soft: #23314a; --chip: #2b2927;
    --core: #6cc070; --pad: #7d756d; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--text);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .card { display: grid; grid-template-columns: 240px 1fr; gap: 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card.horizontal { grid-template-columns: 360px 1fr; }
  .card.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .player { position: relative; }
  video { width: 100%; background: #000; border-radius: 10px; display: block; }
  .badge { position: absolute; top: 8px; left: 8px; font-size: 12px; font-weight: 600;
    padding: 3px 8px; border-radius: 999px; color: #fff; background: var(--pad); pointer-events: none; }
  .badge.core { background: var(--core); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: 13px; }
  .num { font-weight: 700; color: var(--text); font-size: 14px; }
  .tag { background: var(--chip); border-radius: 6px; padding: 1px 8px; }
  h2 { font-size: 18px; margin: 6px 0 4px; }
  .opis { margin: 0 0 14px; }
  .pick { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .pick input { width: 18px; height: 18px; accent-color: var(--accent); }
  textarea { width: 100%; margin-top: 10px; min-height: 56px; resize: vertical; font: inherit; font-size: 14px;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .bar button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 0;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .bar button:disabled { opacity: .45; cursor: default; }
  .msg { color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) {
    .card, .card.horizontal { grid-template-columns: 1fr; }
    .player { max-width: 320px; margin: 0 auto; width: 100%; }
    .card.horizontal .player { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Przegląd b-rolli</h1>
  <p class="lead" id="lead"></p>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>
<div class="bar">
  <span class="msg" id="count">Wybrane: 0</span>
  <button id="copy" disabled>Kopiuj mój wybór</button>
  <span class="msg" id="status" role="status"></span>
</div>
<script>
const CFG = __DANE__;
const DATA = CFG.fragmenty, GROUPS = CFG.grupy || {}, PAD = Number(CFG.zapas || 1.5);
const padTxt = String(PAD).replace(".", ",");
document.getElementById("title").textContent = CFG.tytul || "Przegląd b-rolli";
document.title = CFG.tytul || "Przegląd b-rolli";
document.getElementById("lead").textContent = (CFG.opis_nagrania ? CFG.opis_nagrania + " " : "") +
  `Każdy podgląd ma ${padTxt} s zapasu z przodu i z tyłu. Zielona plakietka „fragment” pokazuje część, która zostanie wycięta. ` +
  "Zaznacz „Biorę”, dopisz uwagi (sekundy licz według tego odtwarzacza) i kliknij „Kopiuj mój wybór” na dole.";

const fmt = t => {
  t = Math.round(Number(t) * 10) / 10;
  const m = Math.floor(t / 60), s = t - m * 60;
  const ss = Number.isInteger(s) ? String(s).padStart(2, "0") : s.toFixed(1).padStart(4, "0").replace(".", ",");
  return String(m).padStart(2, "0") + ":" + ss;
};
const dur = c => (Math.round((c.koniec - c.start) * 10) / 10).toString().replace(".", ",");
const KEY = "brolle-wybor-" + (CFG.tytul || "") + "-" + DATA.length;
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const list = document.getElementById("list");
DATA.forEach(c => {
  const st = state[c.id] || {};
  const card = document.createElement("article");
  card.className = "card" + (st.pick ? " picked" : "");
  card.dataset.group = c.grupa || "";

  const player = document.createElement("div"); player.className = "player";
  const v = document.createElement("video");
  v.src = "podglady/klip_" + String(c.id).padStart(2, "0") + ".mp4";
  v.controls = true; v.loop = true; v.muted = true; v.playsInline = true; v.preload = "metadata";
  const b = document.createElement("span"); b.className = "badge"; b.textContent = "zapas";
  player.append(v, b);
  v.addEventListener("loadedmetadata", () => { if (v.videoWidth > v.videoHeight) card.classList.add("horizontal"); });
  v.addEventListener("timeupdate", () => {
    const core = v.currentTime >= PAD && v.currentTime <= (v.duration || 0) - PAD;
    b.textContent = core ? "fragment" : "zapas"; b.classList.toggle("core", core);
  });

  const info = document.createElement("div");
  const meta = document.createElement("div"); meta.className = "meta";
  const add = (cls, txt) => { const s = document.createElement("span"); if (cls) s.className = cls; s.textContent = txt; meta.append(s); };
  add("num", "#" + c.id); add("", `${fmt(c.start)}–${fmt(c.koniec)} w oryginale`); add("", dur(c) + " s");
  if (c.grupa && GROUPS[c.grupa]) add("tag", GROUPS[c.grupa]);
  const h = document.createElement("h2"); h.textContent = c.tytul;
  const p = document.createElement("p"); p.className = "opis"; p.textContent = c.opis || "";
  const label = document.createElement("label"); label.className = "pick";
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!st.pick;
  label.append(cb, document.createTextNode(" Biorę ten fragment"));
  const ta = document.createElement("textarea");
  ta.placeholder = "Uwagi, np. krócej, zacznij od 3. sekundy, zostaw zapas z tyłu";
  ta.value = st.note || "";
  info.append(meta, h, p, label, ta);
  card.append(player, info);

  cb.addEventListener("change", () => {
    state[c.id] = Object.assign({}, state[c.id], { pick: cb.checked });
    card.classList.toggle("picked", cb.checked); save(); updateCount();
  });
  ta.addEventListener("input", () => { state[c.id] = Object.assign({}, state[c.id], { note: ta.value }); save(); });
  list.append(card);
});

const chips = document.getElementById("chips");
const groupKeys = Object.keys(GROUPS).filter(k => DATA.some(d => d.grupa === k));
if (groupKeys.length > 1) {
  [["*", "Wszystkie"], ...groupKeys.map(k => [k, GROUPS[k]])].forEach(([k, label]) => {
    const n = k === "*" ? DATA.length : DATA.filter(d => d.grupa === k).length;
    const btn = document.createElement("button");
    btn.className = "chip"; btn.textContent = `${label} (${n})`;
    btn.setAttribute("aria-pressed", k === "*" ? "true" : "false");
    btn.addEventListener("click", () => {
      chips.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      list.querySelectorAll(".card").forEach(card => { card.style.display = (k === "*" || card.dataset.group === k) ? "" : "none"; });
    });
    chips.append(btn);
  });
}

const countEl = document.getElementById("count"), copyBtn = document.getElementById("copy"), statusEl = document.getElementById("status");
const picked = () => DATA.filter(c => state[c.id] && state[c.id].pick);
function updateCount() { const n = picked().length; countEl.textContent = "Wybrane: " + n; copyBtn.disabled = n === 0; }
updateCount();
copyBtn.addEventListener("click", async () => {
  const lines = picked().map(c => {
    const note = (state[c.id].note || "").trim();
    return `#${c.id} ${fmt(c.start)}–${fmt(c.koniec)} ${c.tytul}` + (note ? ` | uwagi: ${note}` : "");
  });
  const text = "Mój wybór b-rolli:\n" + lines.join("\n");
  try { await navigator.clipboard.writeText(text); statusEl.textContent = "Skopiowano. Wklej to w czacie."; }
  catch (e) {
    const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select();
    try { document.execCommand("copy"); statusEl.textContent = "Skopiowano. Wklej to w czacie."; }
    catch (e2) { statusEl.textContent = "Nie udało się skopiować. Zaznacz tekst ręcznie."; }
    t.remove();
  }
});
</script>
</body>
</html>
